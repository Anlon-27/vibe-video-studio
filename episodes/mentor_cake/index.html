<script>
/* ================= 配置与章节数据 ================= */
const CFG = {
  duration: 80.0, fps: 30,
  watermark: '@vibe_video_studio',
  accent: '#C9A96A', ink: '#EAEAF2', dim: '#8A8AA0',
  red: '#E04A3F', green: '#38C172', blue: '#4A90E2', cyan: '#4EE1A0'
};

const TITLE_CARD = [13.5, 19.5];

const SECTIONS = [
  [0.0,   '阶段 0 · 微信聊天泡与服从反射', '心理学行为定式：秒回“好的老师”背后的权力级差'],
  [19.5,  '阶段 1 · 四大经典“画饼期权”精算', '无抵押承诺：项目署名、高薪工作、老家人脉与大厂实习'],
  [47.0,  '阶段 2 · 委托-代理人困境与双曲折现', '博弈论机制：导师边际成本归零与学生的沉没青春'],
  [63.0,  '阶段 3 · 贝叶斯后验与理性止损', '决策科学：建立基于兑现增量的停止准则 (Stopping Rule)'],
  [72.0,  '终局 · 哲学审视与认知收敛', '拒绝向虚无期权借贷，守住人生的沉没成本边界']
];

/* 双语旁白字幕表: [起秒, 止秒, 中文(可用<em>强调</em>), 英文] */
const SUBTITLES = [
  [0.8, 3.5, '学生：<em>“好的老师，收到！”</em>', 'Student: "Yes, Professor. Received!"'],
  [3.5, 7.2, '在整个研究生与职场生涯中，这句话你可能不自觉地说过<em>上千次</em>。', 'Throughout academia and early career, you repeat this phrase a thousand times.'],
  [7.2, 11.2, '从行为心理学来看，秒回好的不是敬业，而是大脑面对权力级差的<em>服从防御反射</em>。', 'Replying instantly is an amygdala compliance reflex under hierarchical pressure.'],
  [11.2, 13.5, '因为在这四个字背后，紧接着一个经典博弈陷阱——<em>导师的远期画饼</em>。', 'Behind these four words lies an ancient game-theory trap: empty future promises.'],
  
  [19.8, 23.5, '导师：<em>“这个国家级重大项目我挂你的名字，好好做！”</em>', 'Mentor: "I will put your name on this national key grant. Work hard!"'],
  [23.5, 27.0, '学术期权精算：实际排在<em>第八作者</em>，附赠报销票据整理工时 <em>400 小时</em>。', 'Actuarial audit: 8th co-author plus 400 hours of invoicing paperwork.'],
  
  [27.0, 31.0, '导师：<em>“你不读博也可以，去工业界我打个招呼，起码年薪20万以上！”</em>', 'Mentor: "Even without a PhD, I can get you an industry job making 200k+!"'],
  [31.0, 34.8, '博弈现实：这只是为了以<em>最低边际成本</em>，将廉价劳动力扣在实验室延毕半年。', 'Game reality: binding cheap intellectual labor for another delayed semester.'],
  
  [34.8, 38.8, '导师：<em>“你老家省厅院所里我认识好几个核心领导，到时候直接帮你安排。”</em>', 'Mentor: "I have elite connections in your hometown. I will set you up."'],
  [38.8, 42.5, '心理学定式：远期无抵押的人情信用，本质是<em>沉没成本极高</em>的无息借贷。', 'Cognitive truth: uncollateralized social promises are zero-cost leverage.'],
  
  [42.5, 46.5, '导师：<em>“下半年给你推顶尖大厂实习！下周先把这几篇材料改出来。”</em>', 'Mentor: "I will refer you to top internships next term! Finish this first."'],
  [46.5, 50.0, '著名的<em>“下周复下周”</em>：通过不断移动时间锚点，榨取当下的即时生产力。', 'The moving goalpost fallacy: constantly extending horizons to extract labor.'],
  
  [50.0, 56.5, '在经济学中，这被称为典型的<em>委托-代理人困境</em>：导师成本为零，而你的代价是沉没青春。', 'Economics: Principal-Agent asymmetry where the mentor risks nothing.'],
  [56.5, 63.5, '心理学<em>双曲折现</em>让你为了渺茫的虚幻未来，主动放弃当下的理性止损权。', 'Hyperbolic discounting compels you to forfeit current rights for illusory gains.'],
  
  [63.5, 71.5, '破解画饼的唯一法则，是建立<em>贝叶斯止损边界</em>：只看兑现的增量，不信口头的期权。', 'The only antidote: a Bayesian stop-loss boundary based on concrete evidence.'],
  [71.5, 79.5, '所有无需抵押的远期前途，本质上都在<em>向你的年轻无息借贷</em>。真正的尊重，始于清醒止损。', 'All uncollateralized promises are unbacked loans on your youth. Respect begins with stopping.']
];

/* ================= 辅助函数与活态动画物理算子 ================= */
function clamp(v, min, max){ return Math.max(min, Math.min(max, v)); }
function lerp(a, b, t){ return a + (b - a) * t; }
function easeInOut(t){ return t < 0.5 ? 2*t*t : -1 + (4 - 2*t)*t; }
function easeOut(t){ return 1 - Math.pow(1 - t, 3); }

function dampedOscillation(t, decayRate=1.8, freq=7.0){
  return Math.exp(-t * decayRate) * Math.sin(t * freq);
}

function mulberry32(seed){
  return function(){
    let t = seed += 0x6D2B79F5;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function roundRect(ctx, x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

/* ================= 背景层绘制 ================= */
const bgc = document.getElementById('bg').getContext('2d');
const bgRng = mulberry32(20261026);
const BG_STARS = Array.from({length: 50}, () => ({
  x: bgRng() * 1920, y: bgRng() * 1080, r: 0.6 + bgRng() * 1.4, speed: 0.6 + bgRng() * 1.6, phase: bgRng() * Math.PI * 2
}));

function drawBackground(t){
  bgc.clearRect(0, 0, 1920, 1080);
  const g = bgc.createRadialGradient(960, 480, 60, 960, 480, 1180);
  g.addColorStop(0, '#0F0D24');
  g.addColorStop(0.65, '#080716');
  g.addColorStop(1, '#03020A');
  bgc.fillStyle = g;
  bgc.fillRect(0, 0, 1920, 1080);

  // 背景暗星呼吸微动
  for (const star of BG_STARS){
    const alpha = 0.15 + 0.3 * Math.sin(t * star.speed + star.phase);
    bgc.fillStyle = `rgba(180, 195, 235, ${Math.max(0, alpha)})`;
    bgc.beginPath();
    bgc.arc(star.x, star.y, star.r, 0, Math.PI * 2);
    bgc.fill();
  }
}

/* ================= 中央活态场景绘制 ================= */
const scc = document.getElementById('scene').getContext('2d');

function drawScene(t){
  scc.clearRect(0, 0, 1920, 1080);

  if (t < 13.5) {
    // 【阶段 0】：微信气泡秒回与服从反射模拟 (0.0s - 13.5s)
    drawWeChatComplianceScene(t);
  } else if (t >= 13.5 && t < 19.5) {
    // 标题卡期间画布净空
  } else if (t >= 19.5 && t < 47.0) {
    // 【阶段 1】：四大画饼期权拆解 (19.5s - 47.0s)
    drawPieOptionsScene(t);
  } else if (t >= 47.0 && t < 63.0) {
    // 【阶段 2】：委托-代理人天平与双曲折现 (47.0s - 63.0s)
    drawPrincipalAgentScale(t);
  } else if (t >= 63.0 && t < 72.0) {
    // 【阶段 3】：贝叶斯后验与止损边界 (63.0s - 72.0s)
    drawBayesianStopLoss(t);
  } else {
    // 【终局】：哲学金句与认知收敛 (72.0s - 80.0s)
    drawPhilosophyOutro(t);
  }
}

/* 1. 微信气泡与服从反射场景 */
function drawWeChatComplianceScene(t){
  const cardX = 380, cardY = 160, cardW = 1160, cardH = 560;
  
  // 背景卡片
  scc.save();
  scc.fillStyle = 'rgba(15, 13, 26, 0.94)';
  scc.strokeStyle = '#4F4770'; scc.lineWidth = 2.5;
  roundRect(scc, cardX, cardY, cardW, cardH, 20);
  scc.fill(); scc.stroke();

  // 微信顶部栏拟真
  scc.fillStyle = 'rgba(25, 22, 38, 0.9)';
  roundRect(scc, cardX, cardY, cardW, 64, 20);
  scc.fill();
  scc.fillStyle = '#EAEAF2'; scc.font = "600 22px 'Noto Sans SC', sans-serif";
  scc.fillText('导师 (课题组负责人)', cardX + 50, cardY + 40);
  scc.fillStyle = '#38C172'; scc.font = "700 16px 'JetBrains Mono', monospace";
  scc.fillText('[ 在线 · 实时监视 ]', cardX + cardW - 200, cardY + 40);

  // 1. 导师消息气泡 (左侧白灰底)
  const mentorAlpha = clamp(t / 0.5, 0, 1);
  scc.globalAlpha = mentorAlpha;
  scc.fillStyle = 'rgba(40, 36, 60, 0.95)';
  scc.strokeStyle = 'rgba(100, 95, 130, 0.4)'; scc.lineWidth = 1.5;
  roundRect(scc, cardX + 50, cardY + 95, 800, 75, 14);
  scc.fill(); scc.stroke();
  scc.fillStyle = '#EDE4D3'; scc.font = "500 24px 'Noto Sans SC', sans-serif";
  scc.fillText('小李，手头有个重大项目和几个远期前途，下午来办公室一趟。', cardX + 75, cardY + 142);

  // 2. 学生秒回微信气泡 (右侧高亮绿底)
  if (t >= 0.8) {
    const studentT = t - 0.8;
    const osc = dampedOscillation(studentT, 2.5, 12.0);
    const bubbleScale = 1.0 + osc * 0.08;
    
    scc.save();
    scc.translate(cardX + cardW - 50, cardY + 205);
    scc.scale(bubbleScale, bubbleScale);
    scc.fillStyle = '#2BA245'; // 微信经典绿
    roundRect(scc, -380, 0, 380, 72, 14);
    scc.fill();
    scc.fillStyle = '#FFFFFF'; scc.font = "700 26px 'Noto Sans SC', sans-serif";
    scc.fillText('好的老师，收到！', -350, 45);
    scc.restore();
  }

  // 3. 神经恐惧防御指数仪表盘 (右侧狂飙滚轮)
  scc.globalAlpha = 1.0;
  const reflexT = clamp((t - 1.2) / 3.0, 0, 1);
  const reflexSpeed = (12.4 + (98.6 - 12.4) * easeOut(reflexT)).toFixed(1);
  const replyDelay = (0.95 - (0.95 - 0.18) * easeOut(reflexT)).toFixed(2);

  // 仪表框
  scc.fillStyle = 'rgba(20, 17, 34, 0.85)';
  scc.strokeStyle = '#C9A96A'; scc.lineWidth = 2;
  roundRect(scc, cardX + 50, cardY + 310, 1060, 210, 16);
  scc.fill(); scc.stroke();

  scc.fillStyle = '#C9A96A'; scc.font = "700 22px 'Noto Sans SC', sans-serif";
  scc.fillText('【行为神经经济学检测】 权力级差反射模型 (Amygdala Reflex Model)', cardX + 80, cardY + 350);

  // 滚轮指标 1
  scc.fillStyle = '#EAEAF2'; scc.font = "500 20px 'Noto Sans SC', sans-serif";
  scc.fillText('秒回延迟时间:', cardX + 80, cardY + 410);
  scc.fillStyle = '#4EE1A0'; scc.font = "900 42px 'JetBrains Mono', monospace";
  scc.fillText(`${replyDelay}s`, cardX + 240, cardY + 418);
  scc.fillStyle = '#9A9AB0'; scc.font = "400 16px 'Noto Sans SC', sans-serif";
  scc.fillText('(本能无思考跳过皮层决断)', cardX + 380, cardY + 410);

  // 滚轮指标 2
  scc.fillStyle = '#EAEAF2'; scc.font = "500 20px 'Noto Sans SC', sans-serif";
  scc.fillText('杏仁核恐惧防御度:', cardX + 80, cardY + 475);
  scc.fillStyle = '#E04A3F'; scc.font = "900 42px 'JetBrains Mono', monospace";
  scc.fillText(`${reflexSpeed}%`, cardX + 280, cardY + 483);
  scc.fillStyle = '#9A9AB0'; scc.font = "400 16px 'Noto Sans SC', sans-serif";
  scc.fillText('(服从防御反射激活，心理防线归零)', cardX + 440, cardY + 475);

  scc.restore();
}

/* 2. 四大画饼期权拆解场景 */
function drawPieOptionsScene(t){
  const cardX = 360, cardY = 150, cardW = 1200, cardH = 580;
  scc.save();

  // 卡片容器
  scc.fillStyle = 'rgba(15, 13, 26, 0.95)';
  scc.strokeStyle = '#5F587D'; scc.lineWidth = 2.5;
  roundRect(scc, cardX, cardY, cardW, cardH, 20);
  scc.fill(); scc.stroke();

  // 顶部导航 TAB
  const tabs = [
    { name: "饼一·国家级重大项目", range: [19.5, 26.5] },
    { name: "饼二·年薪20W+与不读博", range: [26.5, 34.0] },
    { name: "饼三·老家关系网人脉", range: [34.0, 41.5] },
    { name: "饼四·大厂顶尖实习", range: [41.5, 47.0] }
  ];

  tabs.forEach((tab, idx) => {
    const isAct = t >= tab.range[0] && t < tab.range[1];
    const tx = cardX + 40 + idx * 280;
    scc.fillStyle = isAct ? '#C9A96A' : 'rgba(40, 36, 60, 0.7)';
    roundRect(scc, tx, cardY + 25, 260, 48, 10);
    scc.fill();
    scc.fillStyle = isAct ? '#060512' : '#9A9AB0';
    scc.font = isAct ? "700 18px 'Noto Sans SC', sans-serif" : "500 16px 'Noto Sans SC', sans-serif";
    scc.textAlign = 'center';
    scc.fillText(tab.name, tx + 130, cardY + 56);
  });
  scc.textAlign = 'left';

  // 内部精算展示区

/* ================= 核心时间驱动契约 window.render(t) ================= */
window.render = function(t){
  // 1. 约束时间范围
  t = clamp(t, 0, CFG.duration);

  // 2. 背景与场景主动效绘制
  drawBackground(t);
  drawScene(t);

  // 3. 顶部场景/阶段标签与学术注释更新
  const isTitle = t >= TITLE_CARD[0] && t < TITLE_CARD[1];
  let activeSection = null;
  for (let i = SECTIONS.length - 1; i >= 0; i--){
    if (t >= SECTIONS[i][0]) { activeSection = SECTIONS[i]; break; }
  }
  const topEl = document.getElementById('toplabel');
  if (topEl) {
    topEl.style.display = isTitle ? 'none' : 'block';
    if (activeSection) topEl.textContent = activeSection[1];
  }

  // 4. 学术注释 (y ≈ 765px)
  const annoEl = document.getElementById('annotation');
  if (annoEl) {
    annoEl.style.display = isTitle ? 'none' : 'block';
    if (activeSection) annoEl.textContent = activeSection[2] || '';
  }

  // 5. 标题卡控制 (13.5s - 19.5s)
  const titleEl = document.getElementById('titlecard');
  if (titleEl) {
    if (t >= TITLE_CARD[0] && t < TITLE_CARD[1]) {
      titleEl.style.display = 'flex';
      titleEl.style.opacity = '1';
    } else {
      titleEl.style.display = 'none';
      titleEl.style.opacity = '0';
    }
  }

  // 6. 双语胶囊字幕更新
  let activeSub = null;
  for (let s of SUBTITLES){
    if (t >= s[0] && t < s[1]) { activeSub = s; break; }
  }
  const pillEl = document.getElementById('sub-pill');
  const subEl = document.getElementById('subtitle');
  const subEnEl = document.getElementById('subtitle-en');
  if (activeSub && (t < TITLE_CARD[0] || t >= TITLE_CARD[1])) {
    if (pillEl) pillEl.style.opacity = '1';
    if (subEl) subEl.innerHTML = activeSub[2];
    if (subEnEl) subEnEl.textContent = activeSub[3];
  } else {
    if (pillEl) pillEl.style.opacity = '0';
  }

  // 7. 水印透明度与显示
  const wmEl = document.getElementById('watermark');
  if (wmEl) {
    const wm = (typeof CFG !== 'undefined' && CFG.watermark) ? CFG.watermark : '';
    wmEl.textContent = wm;
    wmEl.style.display = wm ? 'block' : 'none';
    wmEl.style.opacity = t < 1.0 ? t : 1.0;
  }
};

function formatTime(sec){
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60);
  return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}

function updateTimelineUI(t){
  if (timeline) timeline.value = t;
  if (timeDisp) timeDisp.textContent = `${formatTime(t)} / ${formatTime(CFG.duration)}`;
}

function seek(t){
  t = clamp(t, 0, CFG.duration);
  playStartOffset = t;
  playStartTime = performance.now();
  if (bgm) {
    bgm.currentTime = t;
  }
  window.render(t);
  updateTimelineUI(t);
}

if (timeline) {
  timeline.addEventListener('input', (e) => {
    seek(parseFloat(e.target.value));
  });
}

if (btnPlay) {
  btnPlay.addEventListener('click', () => {
    if (!isPlaying) {
      isPlaying = true;
      btnPlay.textContent = '❚❚ 暂停';
      playStartTime = performance.now();
      if (bgm) bgm.play().catch(()=>{});
      requestAnimationFrame(tick);
    } else {
      isPlaying = false;
      btnPlay.textContent = '▶ 播放';
      if (bgm) bgm.pause();
    }
  });
}

function tick(now){
  if (!isPlaying) return;
  const elapsed = (now - playStartTime) / 1000;
  const t = playStartOffset + elapsed;
  if (t >= CFG.duration) {
    seek(CFG.duration);
    isPlaying = false;
    btnPlay.textContent = '▶ 播放';
    return;
  }
  window.render(t);
  updateTimelineUI(t);
  requestAnimationFrame(tick);
}

// 初始化渲染第一帧
window.render(0);
updateTimelineUI(0);

// 如果处于录屏渲染模式 (__RENDER_MODE__ = true)，隐藏控制栏
if (window.__RENDER_MODE__) {
  const ctrl = document.getElementById('player-controls');
  if (ctrl) ctrl.style.display = 'none';
}
</script>
</body>
</html>
